server.port=8080

# --- In-memory H2 database (swap for MySQL/Postgres when ready) ---
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root

# Console at http://localhost:8080/h2-console (jdbc url above, user sa, blank password)
spring.h2.console.enabled=true

# Auto-create schema from the entities on each start, then load data.sql
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true

# --- JWT ---
# 256-bit+ secret. Replace with an env var / secrets manager value in production.
jwt.secret=replace-this-with-a-long-random-secret-string-at-least-32-bytes-long
jwt.expiration-ms=3600000
