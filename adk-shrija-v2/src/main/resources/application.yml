spring:
  application:
    name: adk-shrija

server:
  port: ${SERVER_PORT:8080}

shrija:
  ai:
    gemini-api-key: ${GEMINI_API_KEY}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
    mcp-server-url: ${MCP_SERVER_URL:http://localhost:8082/mcp}
    jwt:
      secret: ${JWT_SECRET:change-this-development-secret-to-a-random-32-byte-value-123456789}
      expiration-millis: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.shrija.ai: INFO
    com.google.adk: INFO
