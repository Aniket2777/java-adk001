spring:
  application:
    name: adk-shrija

server:
  port: ${SERVER_PORT:8080}

shrija:
  ai:
    provider: bedrock

    api-key: ${BEDROCK_API_KEY}

    model: anthropic.claude-3-7-sonnet

    aws-region: us-east-1

    mcp-server-url: http://localhost:8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.shrija.ai: INFO
    com.google.adk: INFO
