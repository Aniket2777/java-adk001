spring:
  application:
    name: mcp-shrija-server

  datasource:
    url: jdbc:mysql://localhost:3306/shrija_ai
    username: root
    password: root
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Same ddl-auto=update trade-off as before this module existed -
      # the domain layer moved here, the caveat about adding a real
      # migration tool (Flyway/Liquibase) before production moved with it.
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

  ai:
    mcp:
      server:
        name: shrija-mcp-server
        version: 0.1.0
        # VERIFY: exact property keys for the WebMVC MCP server transport
        # (endpoint path, SSE keep-alive, etc.) against the Spring AI
        # 2.0.0 MCP server reference doc - I confirmed the starter exists
        # and that ToolCallbackProvider beans are auto-detected, not every
        # property name under this block.
        type: SYNC

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.shrija.mcpserver: INFO
    com.shrija.domain: INFO
    org.springframework.ai: INFO
