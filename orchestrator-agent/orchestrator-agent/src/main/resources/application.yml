spring:
  application:
    name: orchestrator-agent

server:
  port: ${ORCHESTRATOR_AGENT_PORT:8080}

shrija:
  orchestrator:
    ai:
      gemini-api-key: ${GEMINI_API_KEY}
      gemini-model: ${ORCHESTRATOR_GEMINI_MODEL:gemini-3.1-flash-lite}
      employee-agent-url: ${EMPLOYEE_AGENT_A2A_URL:http://localhost:8083}
      attendance-agent-url: ${ATTENDANCE_AGENT_A2A_URL:http://localhost:8084}
      payroll-agent-url: ${PAYROLL_AGENT_A2A_URL:http://localhost:8085}
      hr-agent-url: ${HR_AGENT_A2A_URL:http://localhost:8088}
      leave-agent-url: ${LEAVE_AGENT_A2A_URL:http://localhost:8087}
      manager-agent-url: ${MANAGER_AGENT_A2A_URL:http://localhost:8086}
      budget-agent-url: ${BUDGET_AGENT_A2A_URL:http://localhost:8089}
      cto-agent-url: ${CTO_AGENT_A2A_URL:http://localhost:8090}
    # Must be the exact same HS256 secret the Auth Service (:8081) signs its JWTs with.
    jwt:
      secret: ${JWT_SECRET}
      # Claim names in the Auth Service's JWT payload. Defaults match "sub", "username", "role",
      # "employeeCode" -- override if the Auth Service uses different claim keys.
      user-id-claim: ${JWT_USER_ID_CLAIM:sub}
      username-claim: ${JWT_USERNAME_CLAIM:username}
      role-claim: ${JWT_ROLE_CLAIM:role}
      employee-code-claim: ${JWT_EMPLOYEE_CODE_CLAIM:employeeCode}

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings,beans

logging:
  level:
    com.shrija.orchestrator: INFO
    com.google.adk: INFO
